<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a1e"/>
      <stop offset="100%" stop-color="#1e1040"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="38%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.25)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#glow)"/>

  <!-- vinyl record: outer ring -->
  <circle cx="400" cy="195" r="145" fill="none" stroke="rgba(139,92,246,0.5)" stroke-width="2"/>
  <circle cx="400" cy="195" r="130" fill="#111827" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>

  <!-- vinyl grooves -->
  <circle cx="400" cy="195" r="118" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="400" cy="195" r="106" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="400" cy="195" r="94"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="400" cy="195" r="82"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="400" cy="195" r="70"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>

  <!-- label area -->
  <circle cx="400" cy="195" r="55" fill="rgba(99,102,241,0.35)" stroke="rgba(139,92,246,0.6)" stroke-width="1.5"/>
  <circle cx="400" cy="195" r="10" fill="rgba(200,180,255,0.8)"/>

  <!-- ResNet label on vinyl -->
  <text x="400" y="185" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle">ResNet50</text>
  <text x="400" y="204" font-family="Arial,sans-serif" font-size="10" fill="rgba(196,181,253,0.75)" text-anchor="middle">Siamese Net</text>

  <!-- CCTV camera left -->
  <rect x="90" y="140" width="54" height="36" rx="5" fill="rgba(55,65,81,0.9)" stroke="rgba(156,163,175,0.4)" stroke-width="1.5"/>
  <circle cx="117" cy="158" r="11" fill="rgba(30,30,50,0.95)" stroke="rgba(99,102,241,0.7)" stroke-width="1.5"/>
  <circle cx="117" cy="158" r="5"  fill="rgba(99,102,241,0.5)"/>
  <rect x="144" y="152" width="20" height="8" rx="2" fill="rgba(55,65,81,0.9)" stroke="rgba(156,163,175,0.3)" stroke-width="1"/>
  <!-- camera label -->
  <text x="117" y="193" font-family="Arial,sans-serif" font-size="11" fill="rgba(156,163,175,0.8)" text-anchor="middle">CCTV</text>

  <!-- match arrow left→vinyl -->
  <line x1="164" y1="158" x2="252" y2="185" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="252,178 265,185 252,192" fill="rgba(99,102,241,0.7)"/>

  <!-- catalog card right -->
  <rect x="570" y="128" width="54" height="68" rx="4" fill="rgba(30,27,75,0.85)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
  <rect x="576" y="134" width="42" height="34" rx="3" fill="rgba(55,48,100,0.8)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <!-- fake album art lines -->
  <line x1="578" y1="145" x2="616" y2="145" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <line x1="578" y1="152" x2="616" y2="152" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <line x1="578" y1="159" x2="610" y2="159" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <text x="597" y="183" font-family="Arial,sans-serif" font-size="10" fill="rgba(196,181,253,0.75)" text-anchor="middle">77% Match</text>
  <text x="597" y="207" font-family="Arial,sans-serif" font-size="11" fill="rgba(156,163,175,0.8)" text-anchor="middle">CATALOG</text>

  <!-- match arrow vinyl→catalog -->
  <line x1="535" y1="185" x2="568" y2="162" stroke="rgba(134,239,172,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="556,158 569,162 562,172" fill="rgba(134,239,172,0.7)"/>

  <!-- accuracy badge -->
  <rect x="328" y="62" width="144" height="32" rx="16" fill="rgba(134,239,172,0.18)" stroke="rgba(134,239,172,0.5)" stroke-width="1.5"/>
  <text x="400" y="83" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="rgba(134,239,172,0.95)" text-anchor="middle">77% Top-1 Accuracy</text>

  <!-- title -->
  <text x="400" y="346" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Vinyl Album Identification</text>
  <text x="400" y="376" font-family="Arial,sans-serif" font-size="15" fill="rgba(196,181,253,0.8)" text-anchor="middle">ResNet50 · Siamese Network · Computer Vision</text>
</svg>
