<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- decorative blobs -->
  <circle cx="700" cy="60"  r="160" fill="rgba(139,92,246,0.12)"/>
  <circle cx="80"  cy="340" r="110" fill="rgba(99,102,241,0.1)"/>

  <!-- neural network: layer 1 -->
  <circle cx="190" cy="130" r="11" fill="rgba(255,255,255,0.55)"/>
  <circle cx="190" cy="200" r="11" fill="rgba(255,255,255,0.55)"/>
  <circle cx="190" cy="270" r="11" fill="rgba(255,255,255,0.55)"/>

  <!-- neural network: layer 2 -->
  <circle cx="330" cy="105" r="11" fill="rgba(167,139,250,0.9)"/>
  <circle cx="330" cy="170" r="11" fill="rgba(167,139,250,0.9)"/>
  <circle cx="330" cy="235" r="11" fill="rgba(167,139,250,0.9)"/>
  <circle cx="330" cy="295" r="11" fill="rgba(167,139,250,0.9)"/>

  <!-- neural network: layer 3 -->
  <circle cx="470" cy="130" r="11" fill="rgba(196,181,253,0.9)"/>
  <circle cx="470" cy="200" r="11" fill="rgba(196,181,253,0.9)"/>
  <circle cx="470" cy="270" r="11" fill="rgba(196,181,253,0.9)"/>

  <!-- output: attack/safe -->
  <circle cx="590" cy="160" r="14" fill="rgba(252,165,165,0.95)"/>
  <circle cx="590" cy="240" r="14" fill="rgba(134,239,172,0.95)"/>

  <!-- connections 1→2 -->
  <line x1="201" y1="130" x2="319" y2="105" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="130" x2="319" y2="170" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="130" x2="319" y2="235" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="200" x2="319" y2="105" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="200" x2="319" y2="170" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="200" x2="319" y2="235" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="200" x2="319" y2="295" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="270" x2="319" y2="170" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="270" x2="319" y2="235" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="201" y1="270" x2="319" y2="295" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- connections 2→3 -->
  <line x1="341" y1="105" x2="459" y2="130" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="341" y1="105" x2="459" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="341" y1="170" x2="459" y2="130" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="341" y1="170" x2="459" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="341" y1="235" x2="459" y2="200" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="341" y1="235" x2="459" y2="270" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="341" y1="295" x2="459" y2="270" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- connections 3→output -->
  <line x1="481" y1="130" x2="576" y2="160" stroke="rgba(252,165,165,0.45)" stroke-width="2"/>
  <line x1="481" y1="200" x2="576" y2="160" stroke="rgba(252,165,165,0.45)" stroke-width="2"/>
  <line x1="481" y1="200" x2="576" y2="240" stroke="rgba(134,239,172,0.45)" stroke-width="2"/>
  <line x1="481" y1="270" x2="576" y2="240" stroke="rgba(134,239,172,0.45)" stroke-width="2"/>

  <!-- labels -->
  <text x="590" y="148" font-family="Arial,sans-serif" font-size="11" fill="rgba(252,165,165,0.8)" text-anchor="middle">JAILBREAK</text>
  <text x="590" y="264" font-family="Arial,sans-serif" font-size="11" fill="rgba(134,239,172,0.8)" text-anchor="middle">SAFE</text>

  <!-- title -->
  <text x="400" y="346" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">LLM Red-Teaming Framework</text>
  <text x="400" y="376" font-family="Arial,sans-serif" font-size="15" fill="rgba(196,181,253,0.8)" text-anchor="middle">Multi-Agent · JailbreakBench · Python</text>
</svg>
